name: Database migration smoke tests

on:
  push:
    branches: [main]
    paths:
      - 'dba/mig/**'
      - 'tools/SqlMigrator/**'
      - '.github/workflows/db-migrations-smoke.yml'
  pull_request:
    paths:
      - 'dba/mig/**'
      - 'tools/SqlMigrator/**'
      - '.github/workflows/db-migrations-smoke.yml'
  workflow_dispatch:

jobs:
  sqlite-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Create clean SQLite database and apply migrations
        run: dotnet run --project tools/SqlMigrator/SqlMigrator.csproj -- --provider sqlite --connection "Data Source=$RUNNER_TEMP/shoutech-fresh.db"
      - name: Re-run migrations against the same SQLite database
        run: dotnet run --project tools/SqlMigrator/SqlMigrator.csproj -- --provider sqlite --connection "Data Source=$RUNNER_TEMP/shoutech-fresh.db"
      - name: Assert journal header columns exist in SQLite
        run: |
          python3 - <<'PY'
          import sqlite3, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "shoutech-fresh.db")
          with sqlite3.connect(path) as con:
              columns = {row[1] for row in con.execute("PRAGMA table_info(journal_entries)")}
              indexes = {row[1] for row in con.execute("PRAGMA index_list('journal_entries')")}
          required = {"reference_number", "currency_code", "exchange_rate", "document_number", "fiscal_period_id"}
          missing = sorted(required - columns)
          if missing:
              raise SystemExit(f"SQLite journal_entries is missing columns: {missing}")
          if "ux_journal_entries_company_document_number" not in indexes:
              raise SystemExit("SQLite journal document-number uniqueness index is missing")
          tables = {row[0] for row in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required_tables = {"cash_vouchers", "cash_voucher_lines", "cash_voucher_audit_events"}
          missing_tables = sorted(required_tables - tables)
          if missing_tables:
              raise SystemExit(f"SQLite cash voucher tables are missing: {missing_tables}")
          voucher_columns = {row[1] for row in con.execute("PRAGMA table_info(cash_vouchers)")}
          required_columns = {"company_id", "voucher_kind", "voucher_number", "treasury_account_id", "total_amount", "exchange_rate", "fiscal_period_id", "journal_entry_id", "reversal_journal_entry_id", "status"}
          missing_columns = sorted(required_columns - voucher_columns)
          if missing_columns:
              raise SystemExit(f"SQLite cash_vouchers columns are missing: {missing_columns}")
          print("SQLite journal and cash voucher schema verified.")
          PY
      - name: Test existing SQLite migration-history table
        run: |
          python3 - <<'PY'
          import sqlite3, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "shoutech-existing-history.db")
          con = sqlite3.connect(path)
          con.execute("""CREATE TABLE schema_migrations (
              migration_id TEXT PRIMARY KEY,
              checksum TEXT NOT NULL,
              applied_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP
          )""")
          con.commit()
          con.close()
          PY
          dotnet run --project tools/SqlMigrator/SqlMigrator.csproj -- --provider sqlite --connection "Data Source=$RUNNER_TEMP/shoutech-existing-history.db"
          dotnet run --project tools/SqlMigrator/SqlMigrator.csproj -- --provider sqlite --connection "Data Source=$RUNNER_TEMP/shoutech-existing-history.db"

  postgresql-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shoutest
          POSTGRES_PASSWORD: shoutest
          POSTGRES_DB: shoutest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shoutest -d shoutest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Apply migrations to clean PostgreSQL database
        env:
          PG_CONN: Host=localhost;Port=5432;Database=shoutest;Username=shoutest;Password=shoutest
        run: dotnet run --project tools/SqlMigrator/SqlMigrator.csproj -- --provider postgresql --connection "$PG_CONN"
      - name: Re-run migrations against the same PostgreSQL database
        env:
          PG_CONN: Host=localhost;Port=5432;Database=shoutest;Username=shoutest;Password=shoutest
        run: dotnet run --project tools/SqlMigrator/SqlMigrator.csproj -- --provider postgresql --connection "$PG_CONN"
      - name: Assert journal header columns exist in PostgreSQL
        env:
          PG_CONN: Host=localhost;Port=5432;Database=shoutest;Username=shoutest;Password=shoutest
          PGPASSWORD: shoutest
        run: |
          count=$(psql -h localhost -U shoutest -d shoutest -Atc "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='journal_entries' AND column_name IN ('reference_number','currency_code','exchange_rate','document_number','fiscal_period_id')")
          test "$count" = "5" || { echo "Expected five journal header columns, found $count"; exit 1; }
          index_count=$(psql -h localhost -U shoutest -d shoutest -Atc "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND tablename='journal_entries' AND indexname='ux_journal_entries_company_document_number'")
          test "$index_count" = "1" || { echo "PostgreSQL journal document-number uniqueness index is missing"; exit 1; }
          voucher_table_count=$(psql -h localhost -U shoutest -d shoutest -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('cash_vouchers','cash_voucher_lines','cash_voucher_audit_events')")
          test "$voucher_table_count" = "3" || { echo "Expected three cash voucher tables, found $voucher_table_count"; exit 1; }
          voucher_column_count=$(psql -h localhost -U shoutest -d shoutest -Atc "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='cash_vouchers' AND column_name IN ('company_id','voucher_kind','voucher_number','treasury_account_id','total_amount','exchange_rate','fiscal_period_id','journal_entry_id','reversal_journal_entry_id','status')")
          test "$voucher_column_count" = "10" || { echo "Expected ten cash_vouchers columns, found $voucher_column_count"; exit 1; }
          voucher_unique_index=$(psql -h localhost -U shoutest -d shoutest -Atc "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND tablename='cash_vouchers' AND indexname='cash_vouchers_company_id_voucher_kind_voucher_number_key'")
          test "$voucher_unique_index" = "1" || { echo "PostgreSQL cash voucher uniqueness constraint is missing"; exit 1; }
          echo "PostgreSQL journal and cash voucher schema verified."
      - name: Test existing PostgreSQL migration-history table
        env:
          PG_CONN_HISTORY: Host=localhost;Port=5432;Database=shoutest_existing_history;Username=shoutest;Password=shoutest
        run: |
          # Use a separate empty database: dropping public alone may leave application objects in other schemas.
          PGPASSWORD=shoutest createdb -h localhost -U shoutest shoutest_existing_history
          PGPASSWORD=shoutest psql -h localhost -U shoutest -d shoutest_existing_history -v ON_ERROR_STOP=1 -c "CREATE TABLE schema_migrations (migration_id text PRIMARY KEY, checksum char(64) NOT NULL, applied_at timestamptz NOT NULL DEFAULT now());"
          dotnet run --project tools/SqlMigrator/SqlMigrator.csproj -- --provider postgresql --connection "$PG_CONN_HISTORY"
          dotnet run --project tools/SqlMigrator/SqlMigrator.csproj -- --provider postgresql --connection "$PG_CONN_HISTORY"
